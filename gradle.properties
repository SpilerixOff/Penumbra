# Propriétés de build Penumbra

# --- Identité du livrable (source unique) ---
mod_version=0.19.0
maven_group=fr.penumbra
archives_base_name=penumbra

# --- Toolchain et dépendances ---
minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2
java_version=25
junit_version=5.13.4
junit_platform_version=1.13.4

# Version vérifiée le 2026-07-17 via https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml
# (dernière stable ; 1.18.0-alpha.9 existe mais reste en alpha)
fabric_loom_version=1.17.16

# --- Gradle ---
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle détecte le JDK via JAVA_HOME ou sa toolchain. Ne pas fixer ici de
# chemin propre à une machine : cela rendrait le wrapper non portable.
